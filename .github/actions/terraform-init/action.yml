name: terraform-init
description: Install Terraform, inject account-specific variables and init the env's S3 backend.
inputs:
  environment:
    description: dev | qa | prod
    required: true
  aws_account_id:
    description: Target AWS account ID
    required: true
  aws_region:
    description: AWS region
    required: true
  eks_admin_principal_arns:
    description: JSON list of IAM ARNs granted EKS cluster-admin (optional)
    required: false
    default: ""
  terraform_version:
    description: Terraform version
    required: true
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    # *.auto.tfvars(.json) outrank terraform.tfvars; TF_VAR_* env vars do NOT
    # (they have the lowest precedence), so the committed placeholders would win.
    - name: Write account-specific variables
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      env:
        ACCOUNT_ID: ${{ inputs.aws_account_id }}
        REGION: ${{ inputs.aws_region }}
        ADMINS: ${{ inputs.eks_admin_principal_arns }}
      run: |
        jq -n --arg acct "$ACCOUNT_ID" --arg region "$REGION" --arg admins "$ADMINS" '
          {aws_account_id: $acct, region: $region}
          + (if $admins == "" then {} else {eks_admin_principal_arns: ($admins | fromjson)} end)
        ' > ci.auto.tfvars.json
        jq 'keys' ci.auto.tfvars.json

    - name: terraform init
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      env:
        ACCOUNT_ID: ${{ inputs.aws_account_id }}
        REGION: ${{ inputs.aws_region }}
      run: |
        terraform init -input=false -lockfile=readonly \
          -backend-config="bucket=acme-tfstate-${ACCOUNT_ID}-${REGION}" \
          -backend-config="region=${REGION}"
