# Reusable: plan with the read-only role, then apply THAT exact plan with the
# write role after the environment gate is approved.
name: _terraform-apply

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_account_id:
        required: true
        type: string
      eks_admin_principal_arns:
        required: false
        type: string
        default: ""
    secrets:
      TF_PLAN_ENCRYPTION_KEY:
        required: true

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Serialize all runs that touch the same state; never cancel a running apply.
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/gha-terraform-plan-${{ inputs.environment }}
          role-session-name: gha-plan-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ inputs.environment }}
          aws_account_id: ${{ inputs.aws_account_id }}
          aws_region: ${{ vars.AWS_REGION }}
          eks_admin_principal_arns: ${{ inputs.eks_admin_principal_arns }}
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          [ "$code" -eq 1 ] && exit 1
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Approvers see this table on the run page before approving the apply.
          {
            ../../scripts/plan-summary.sh "${{ inputs.environment }}" tfplan
            echo
            echo "<details><summary>Full plan output</summary>"
            echo
            echo '```hcl'
            tail -c 55000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Plan files can contain sensitive values - encrypt before it becomes an artifact.
      - name: Encrypt plan
        if: steps.plan.outputs.has_changes == 'true'
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in tfplan -out tfplan.enc -pass env:PLAN_KEY

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.has_changes == 'true'
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: envs/${{ inputs.environment }}/tfplan.enc
          retention-days: 1
          if-no-files-found: error

  apply:
    name: apply
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The environment gate (required reviewers, main-only) protects this job.
    # Only jobs in this environment get an OIDC sub that the apply role trusts.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/gha-terraform-apply-${{ inputs.environment }}
          role-session-name: gha-apply-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ inputs.environment }}
          aws_account_id: ${{ inputs.aws_account_id }}
          aws_region: ${{ vars.AWS_REGION }}
          eks_admin_principal_arns: ${{ inputs.eks_admin_principal_arns }}
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: envs/${{ inputs.environment }}

      - name: Decrypt plan
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in tfplan.enc -out tfplan -pass env:PLAN_KEY

      # Applying the saved plan guarantees we deploy exactly what was reviewed.
      # If state changed since the plan, Terraform refuses ("saved plan is stale").
      - name: terraform apply
        run: |
          terraform apply -lock-timeout=5m -no-color tfplan | tee apply.txt
          {
            echo "### \`${{ inputs.environment }}\` applied ✅"
            grep -E '^Apply complete!' apply.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
